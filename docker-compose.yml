services:
  postgres:
    image: postgres:17-alpine
    container_name: corey-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: corey
      POSTGRES_PASSWORD: corey
      POSTGRES_DB: corey
    ports:
      # Host 5433 to avoid colliding with other local Postgres instances.
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U corey -d corey"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: corey-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: corey
      MINIO_ROOT_PASSWORD: corey-secret
    ports:
      - "9002:9000" # S3 API (host 9002)
      - "9003:9001" # Web console (host 9003)
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: create the models bucket once MinIO is healthy.
  minio-init:
    image: minio/mc:latest
    container_name: corey-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 corey corey-secret &&
      mc mb --ignore-existing local/corey-models &&
      echo 'MinIO bucket corey-models ready';
      "

volumes:
  postgres-data:
  minio-data:

name: CI

on:
  pull_request:
  push:
    branches:
      - development
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://corey:corey@localhost:5432/corey?schema=public
      S3_ENDPOINT: http://localhost:9000
      S3_REGION: ap-southeast-1
      S3_ACCESS_KEY: corey
      S3_SECRET_KEY: corey-secret
      S3_BUCKET: corey-models
      COREY_MAX_MODEL_BYTES: "262144000"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.32.1

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Check runtime assets
        run: pnpm check:assets

      - name: Build
        run: pnpm build

      - name: Audit production dependencies
        run: pnpm audit --prod

  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build runner image
        run: docker build --target runner -t corey:ci .

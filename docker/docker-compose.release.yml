name: corey-release

services:
  app:
    image: corey:release-with-docs
    build:
      context: ..
      target: runner
      labels:
        org.opencontainers.image.description: "COREY release package with bundled docs"
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DOCKER_DATABASE_URL:-postgresql://corey:corey@postgres:5432/corey?schema=public}
      # Placeholder S3 settings keep health checks green for local-first runs.
      # Server-backed model upload/download still needs real S3-compatible storage.
      S3_ENDPOINT: ${DOCKER_S3_ENDPOINT:-http://s3-disabled.invalid}
      S3_REGION: ${S3_REGION:-ap-southeast-1}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-disabled}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-disabled}
      S3_BUCKET: ${S3_BUCKET:-disabled}
      COREY_MAX_MODEL_BYTES: ${COREY_MAX_MODEL_BYTES:-262144000}
      COREY_MCP_BRIDGE_URL: ${COREY_MCP_BRIDGE_URL:-}
      COREY_MCP_BRIDGE_SECRET: ${COREY_MCP_BRIDGE_SECRET:-}
      COREY_MCP_PUBLIC_URL: ${COREY_MCP_PUBLIC_URL:-http://localhost:4001/mcp}
      COREY_APP_PUBLIC_URL: ${COREY_APP_PUBLIC_URL:-http://localhost:4000}
      COREY_MCP_INTERNAL_URL: http://mcp:4001
      COREY_MCP_ADMIN_USERS: ${COREY_MCP_ADMIN_USERS:-local}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      OPENAI_EMBEDDING_DIMENSIONS: ${OPENAI_EMBEDDING_DIMENSIONS:-1536}
      OPENAI_CHAT_MODEL: ${OPENAI_CHAT_MODEL:-gpt-5.4-mini}
      PORT: 4000
      HOSTNAME: ${HOSTNAME:-0.0.0.0}
    ports:
      - "${APP_PORT:-4000}:4000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4000/api/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  mcp:
    profiles: ["mcp"]
    image: corey-mcp:release
    build:
      context: ..
      target: mcp-runner
    restart: unless-stopped
    environment:
      COREY_BASE_URL: http://app:4000
      COREY_USER_HEADER: ${COREY_USER_HEADER:-x-forwarded-user}
      COREY_MCP_BIND: 0.0.0.0
      COREY_MCP_PORT: 4001
      COREY_MCP_BRIDGE_SECRET: ${COREY_MCP_BRIDGE_SECRET:-disabled}
      COREY_MCP_ALLOWED_ORIGINS: ${COREY_MCP_ALLOWED_ORIGINS:-http://localhost:4000}
      COREY_MCP_PUBLIC_URL: ${COREY_MCP_PUBLIC_URL:-http://localhost:4001/mcp}
      COREY_APP_PUBLIC_URL: ${COREY_APP_PUBLIC_URL:-http://localhost:4000}
      COREY_MCP_INDEX_CACHE_ENTRIES: ${COREY_MCP_INDEX_CACHE_ENTRIES:-3}
      COREY_MCP_TRUST_PROXY: ${COREY_MCP_TRUST_PROXY:-0}
    ports:
      - "${MCP_PORT:-4001}:4001"
    depends_on:
      app:
        condition: service_healthy

  migrate:
    build:
      context: ..
      target: tools
    environment:
      DATABASE_URL: ${DOCKER_DATABASE_URL:-postgresql://corey:corey@postgres:5432/corey?schema=public}
    depends_on:
      postgres:
        condition: service_healthy
    command: ["npx", "prisma", "migrate", "deploy"]

  postgres:
    image: pgvector/pgvector:0.8.6-pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-corey}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-corey}
      POSTGRES_DB: ${POSTGRES_DB:-corey}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-release-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-release-data:

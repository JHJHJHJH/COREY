name: bca-ifc-no-minio

services:
  app:
    build:
      context: ..
      target: runner
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DOCKER_DATABASE_URL:-postgresql://corey:corey@postgres:5432/corey?schema=public}
      # Placeholder S3 settings keep health checks green for local-first runs.
      # Server-backed model upload/download still needs real S3-compatible storage.
      S3_ENDPOINT: ${DOCKER_S3_ENDPOINT:-http://s3-disabled.invalid}
      S3_REGION: ${S3_REGION:-ap-southeast-1}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-disabled}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-disabled}
      S3_BUCKET: ${S3_BUCKET:-disabled}
      COREY_MAX_MODEL_BYTES: ${COREY_MAX_MODEL_BYTES:-262144000}
      PORT: 4000
      HOSTNAME: ${HOSTNAME:-0.0.0.0}
    ports:
      - "${APP_PORT:-4000}:4000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4000/api/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  migrate:
    build:
      context: ..
      target: tools
    environment:
      DATABASE_URL: ${DOCKER_DATABASE_URL:-postgresql://corey:corey@postgres:5432/corey?schema=public}
    depends_on:
      postgres:
        condition: service_healthy
    command: ["npx", "prisma", "migrate", "deploy"]

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-corey}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-corey}
      POSTGRES_DB: ${POSTGRES_DB:-corey}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-no-minio-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-no-minio-data:

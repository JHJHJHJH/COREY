name: corey

services:
  app:
    build:
      context: ..
      target: runner
    container_name: corey-app
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DOCKER_DATABASE_URL:-postgresql://corey:corey@postgres:5432/corey?schema=public}
      S3_ENDPOINT: ${DOCKER_S3_ENDPOINT:-http://minio:9000}
      S3_REGION: ${S3_REGION:-ap-southeast-1}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-corey}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-corey-secret}
      S3_BUCKET: ${S3_BUCKET:-corey-models}
      COREY_MAX_MODEL_BYTES: ${COREY_MAX_MODEL_BYTES:-262144000}
      COREY_MCP_BRIDGE_URL: ${COREY_MCP_BRIDGE_URL:-}
      COREY_MCP_BRIDGE_SECRET: ${COREY_MCP_BRIDGE_SECRET:-}
      COREY_MCP_PUBLIC_URL: ${COREY_MCP_PUBLIC_URL:-http://localhost:4001/mcp}
      COREY_APP_PUBLIC_URL: ${COREY_APP_PUBLIC_URL:-http://localhost:4000}
      COREY_MCP_INTERNAL_URL: http://mcp:4001
      COREY_MCP_ADMIN_USERS: ${COREY_MCP_ADMIN_USERS:-local}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      OPENAI_EMBEDDING_DIMENSIONS: ${OPENAI_EMBEDDING_DIMENSIONS:-1536}
      OPENAI_CHAT_MODEL: ${OPENAI_CHAT_MODEL:-gpt-5.4-mini}
      PORT: ${PORT:-4000}
      HOSTNAME: ${HOSTNAME:-0.0.0.0}
    ports:
      - "${PORT:-4000}:4000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4000/api/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  mcp:
    profiles: ["mcp"]
    build:
      context: ..
      target: mcp-runner
    container_name: corey-mcp
    restart: unless-stopped
    environment:
      COREY_BASE_URL: http://app:4000
      COREY_USER_HEADER: ${COREY_USER_HEADER:-x-forwarded-user}
      COREY_MCP_BIND: 0.0.0.0
      COREY_MCP_PORT: 4001
      COREY_MCP_BRIDGE_SECRET: ${COREY_MCP_BRIDGE_SECRET:-disabled}
      COREY_MCP_ALLOWED_ORIGINS: ${COREY_MCP_ALLOWED_ORIGINS:-http://localhost:4000}
      COREY_MCP_PUBLIC_URL: ${COREY_MCP_PUBLIC_URL:-http://localhost:4001/mcp}
      COREY_APP_PUBLIC_URL: ${COREY_APP_PUBLIC_URL:-http://localhost:4000}
      COREY_MCP_INDEX_CACHE_ENTRIES: ${COREY_MCP_INDEX_CACHE_ENTRIES:-3}
      COREY_MCP_TRUST_PROXY: ${COREY_MCP_TRUST_PROXY:-0}
    ports:
      - "${MCP_PORT:-4001}:4001"
    depends_on:
      app:
        condition: service_healthy

  migrate:
    build:
      context: ..
      target: tools
    container_name: corey-migrate
    environment:
      DATABASE_URL: ${DOCKER_DATABASE_URL:-postgresql://corey:corey@postgres:5432/corey?schema=public}
    depends_on:
      postgres:
        condition: service_healthy
    command: ["npx", "prisma", "migrate", "deploy"]

  postgres:
    image: pgvector/pgvector:0.8.6-pg17
    container_name: corey-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-corey}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-corey}
      POSTGRES_DB: ${POSTGRES_DB:-corey}
    ports:
      # Host 5433 to avoid colliding with other local Postgres instances.
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: corey-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-corey}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-corey-secret}
    ports:
      - "${MINIO_API_PORT:-9002}:9000" # S3 API
      - "${MINIO_CONSOLE_PORT:-9003}:9001" # Web console
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: create the models bucket once MinIO is healthy.
  minio-init:
    image: minio/mc:latest
    container_name: corey-minio-init
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-corey}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-corey-secret}
      S3_BUCKET: ${S3_BUCKET:-corey-models}
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 \"$${S3_ACCESS_KEY}\" \"$${S3_SECRET_KEY}\" &&
      mc mb --ignore-existing \"local/$${S3_BUCKET}\" &&
      echo \"MinIO bucket $${S3_BUCKET} ready\";
      "

volumes:
  postgres-data:
  minio-data:
